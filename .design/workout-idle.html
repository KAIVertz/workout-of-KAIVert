<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<style>
@import url('https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#09090b;--surface:#111113;--border:#27272a;
  --accent:#F97316;--day:#7C3AED;
  --text:#fafafa;--t2:#a1a1aa;--t3:#52525b;
}
body{
  width:390px;height:844px;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,#7C3AED12 0%,transparent 65%);pointer-events:none;z-index:0;}
.main{flex:1;display:flex;flex-direction:column;padding:0 20px;position:relative;z-index:1;overflow:hidden;}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb .t{font-size:15px;font-weight:700;}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-shrink:0;}
.hdr-title{font-family:'Racing Sans One',system-ui;font-size:52px;color:var(--text);line-height:.85;letter-spacing:-.02em;}
.hdr-date{font-size:12px;color:var(--t3);margin-top:5px;text-transform:capitalize;}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:7px 14px;}
.streak-n{font-family:'Racing Sans One',system-ui;font-size:22px;color:var(--accent);line-height:1;}
.streak-l{font-size:11px;color:var(--t3);}
.day-card{background:var(--surface);border:1px solid #7C3AED44;border-top:3px solid var(--day);border-radius:20px;padding:16px 18px;margin-bottom:14px;flex-shrink:0;box-shadow:0 4px 28px #7C3AED0c;}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.dc-name{font-family:'Racing Sans One',system-ui;font-size:34px;color:var(--text);line-height:1;}
.dc-sub{font-size:11px;color:var(--t2);margin-top:3px;}
.dc-badge{font-size:11px;font-weight:700;color:var(--day);background:#7C3AED14;border:1px solid #7C3AED44;border-radius:8px;padding:4px 10px;}
.week{display:flex;justify-content:space-between;}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;}
.wl{font-size:10px;color:var(--t3);}
.wdot{width:30px;height:30px;border-radius:8px;background:#0c0c0e;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.wdot.done{background:#7C3AED1a;border-color:#7C3AED66;}
.wdot.today{border-color:var(--day);box-shadow:0 0 8px #7C3AED44;}
.wdot-i{width:8px;height:8px;border-radius:50%;background:var(--day);}
.wdot-s{width:4px;height:4px;border-radius:50%;background:var(--day);opacity:.6;}
.ex-sec{flex:1;overflow:hidden;margin-bottom:14px;}
.ex-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;}
.ex-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #111113;}
.ex-item:last-child{border-bottom:none;}
.ex-l{display:flex;align-items:center;gap:10px;}
.ex-bar{width:3px;height:14px;border-radius:2px;background:var(--day);opacity:.6;flex-shrink:0;}
.ex-name{font-size:14px;font-weight:500;color:#e4e4e7;}
.ex-meta{font-size:12px;color:var(--t3);}
.btn-start{width:100%;padding:20px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:-apple-system,sans-serif;box-shadow:0 0 32px #F9731644,0 4px 16px #F9731622;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;margin-bottom:14px;}
.tabbar{height:83px;background:var(--bg);border-top:1px solid #1c1c1f;display:flex;padding:0 8px;flex-shrink:0;position:relative;z-index:1;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;}
.tab-lbl{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.on .tab-lbl{color:var(--accent);}
.off .tab-lbl{color:var(--t3);}
</style>
</head>
<body>
<div class="glow"></div>
<div class="main">
  <div class="sb"><span class="t">9:41</span><svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x=".5" y=".5" width="14" height="11" rx="2.5" stroke="#a1a1aa"/><rect x="15" y="3.5" width="1.5" height="5" rx=".75" fill="#a1a1aa"/><rect x="2" y="2" width="9" height="8" rx="1.5" fill="#a1a1aa"/></svg></div>
  <div class="hdr">
    <div><div class="hdr-title">KAI</div><div class="hdr-date">lundi 22 juin</div></div>
    <div class="streak"><span class="streak-n">7</span><span class="streak-l">jours</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 3z"/></svg></div>
  </div>
  <div class="day-card">
    <div class="dc-top">
      <div><div class="dc-name">Chest</div><div class="dc-sub">Pectoraux · Abdos</div></div>
      <div class="dc-badge">6 exos</div>
    </div>
    <div class="week">
      <div class="wd"><span class="wl">L</span><div class="wdot today"><div class="wdot-s"></div></div></div>
      <div class="wd"><span class="wl">M</span><div class="wdot done"><div class="wdot-i"></div></div></div>
      <div class="wd"><span class="wl">M</span><div class="wdot done"><div class="wdot-i"></div></div></div>
      <div class="wd"><span class="wl">J</span><div class="wdot done"><div class="wdot-i"></div></div></div>
      <div class="wd"><span class="wl">V</span><div class="wdot"></div></div>
      <div class="wd"><span class="wl">S</span><div class="wdot"></div></div>
      <div class="wd"><span class="wl">D</span><div class="wdot"></div></div>
    </div>
  </div>
  <div class="ex-sec">
    <div class="ex-lbl">Programme du jour</div>
    <div class="ex-item"><div class="ex-l"><div class="ex-bar"></div><span class="ex-name">Corde à sauter</span></div><span class="ex-meta">3×30s</span></div>
    <div class="ex-item"><div class="ex-l"><div class="ex-bar"></div><span class="ex-name">DB Floor Press</span></div><span class="ex-meta">5×10 · 12kg</span></div>
    <div class="ex-item"><div class="ex-l"><div class="ex-bar"></div><span class="ex-name">DB Floor Fly</span></div><span class="ex-meta">4×12 · 7kg</span></div>
    <div class="ex-item"><div class="ex-l"><div class="ex-bar"></div><span class="ex-name">Push-up</span></div><span class="ex-meta">3×max</span></div>
    <div class="ex-item"><div class="ex-l"><div class="ex-bar"></div><span class="ex-name">Leg Raise</span></div><span class="ex-meta">4×15</span></div>
    <div class="ex-item"><div class="ex-l"><div class="ex-bar"></div><span class="ex-name">Ab Roller</span></div><span class="ex-meta">3×8</span></div>
  </div>
  <button class="btn-start"><svg width="14" height="14" viewBox="0 0 14 14" fill="white"><path d="M3 1.5l9 5.5-9 5.5V1.5z"/></svg>Commencer</button>
</div>
<div class="tabbar">
  <div class="tab on"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="4" height="6" rx="1"/><rect x="15" y="8" width="4" height="6" rx="1"/><line x1="7" y1="11" x2="15" y2="11"/></svg><span class="tab-lbl">Workout</span></div>
  <div class="tab off"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round"><line x1="4" y1="18" x2="4" y2="10"/><line x1="8" y1="18" x2="8" y2="14"/><line x1="12" y1="18" x2="12" y2="6"/><line x1="16" y1="18" x2="16" y2="12"/><line x1="20" y1="18" x2="20" y2="8"/></svg><span class="tab-lbl">Stats</span></div>
  <div class="tab off"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="9"/><path d="M9 8.5c0-1.1.9-2 2-2s2 .9 2 2c0 1.7-2 2.5-2 4"/><circle cx="11" cy="15.5" r=".5" fill="#52525b"/></svg><span class="tab-lbl">Coach</span></div>
</div>
</body>
</html>
